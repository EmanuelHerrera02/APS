# =============================================================================
# AeroNet - Configuracion del backend
#
# Los valores por defecto son de desarrollo y coinciden con docker-compose.yml.
# Cada clave se sobreescribe con su variable de entorno para despliegue:
#
#   AERONET_DB_URL      jdbc:mariadb://host:3306/aeronet
#   AERONET_DB_USER
#   AERONET_DB_PASSWORD
#   AERONET_HOST
#   AERONET_PORT
#   AERONET_JWT_SECRET  (obligatorio en produccion: si no, el proceso no arranca)
#   AERONET_JWT_ISSUER
# =============================================================================

aeronet {
  db {
    url      = "jdbc:mariadb://localhost:3306/aeronet"
    url      = ${?AERONET_DB_URL}
    user     = "aeronet_app"
    user     = ${?AERONET_DB_USER}
    password = "aeronet_app_dev"
    password = ${?AERONET_DB_PASSWORD}

    # La base y el servidor trabajan en hora argentina (-03:00); las fechas y
    # horas de vuelo son locales y no tienen zona horaria.
    # Ver seccion 6 de docs/manual-base-de-datos.md.
    connection-timeout-ms = 5000
  }

  server {
    host = "0.0.0.0"
    host = ${?AERONET_HOST}
    port = 8080
    port = ${?AERONET_PORT}
  }

  jwt {
    # Sin valor por defecto a proposito: si nadie lo define, el arranque falla
    # en vez de firmar tokens con una clave conocida.
    secret = ${?AERONET_JWT_SECRET}
    issuer = "aeronet"
    issuer = ${?AERONET_JWT_ISSUER}
  }
}
